model = "gpt-6-astra"
model_reasoning_effort = "max"
service_tier = "fast"
# CLI-only Computer Use transport; Desktop owns the shared runtime configuration.
[mcp_servers.cua_repl]
  args = [
    "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node",
    "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules/@oai/cua-repl/bin/cua-repl.mjs",
  ]
  command = "/Users/prb/.codex/helpers/cua-repl"
  # Retained for explicit re-enablement; native Computer Use is disabled for CLI sessions.
  enabled = false
  enabled_tools = ["js", "js_reset", "turn_ended"]
  env_vars = []
  omit_tools_from = ["code_mode", "deferred"]
  startup_timeout_sec = 120
  tool_timeout_sec = 45

[mcp_servers.cua_repl.tools.js]
  output_token_limit = 25000

[mcp_servers.cua_repl.env]
  # helpers/cua-repl reads the installed app version on every launch.
  BROWSER_USE_AVAILABLE_BACKENDS = ""
  BROWSER_USE_CODEX_APP_BUILD_FLAVOR = "prod"
  BROWSER_USE_TINYSKY_ENABLED = "1"
  CODEX_CLI_PATH = "/Applications/ChatGPT.app/Contents/Resources/codex"
  CODEX_HOME = "/Users/prb/.codex"
  CUA_REPL_ENABLED_SURFACES = "computer"
  CUA_REPL_NODE_REPL_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node_repl"
  NODE_REPL_INSTRUCTIONS_USE_CASE_COMPUTER_USE = "Control desktop apps on macOS through Computer Use."
  NODE_REPL_NATIVE_PIPE_CONNECT_TIMEOUT_MS = "1000"
  NODE_REPL_NODE_MODULE_DIRS = "/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
  NODE_REPL_NODE_PATH = "/Applications/ChatGPT.app/Contents/Resources/cua_node/bin/node"
  NODE_REPL_TRUSTED_CODE_PATHS = "/Users/prb/.codex:/Applications/ChatGPT.app/Contents/Resources/cua_node/lib/node_modules"
  NODE_REPL_TRUSTED_SERVICES = '{"sky":"@oai/sky/service"}'
  SKY_CUA_SERVICE_PATH = "/Users/prb/.codex/computer-use/Codex Computer Use.app"
