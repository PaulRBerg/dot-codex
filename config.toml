#:schema https://developers.openai.com/codex/config-schema.json
# See:
#   - https://developers.openai.com/codex/local-config#cli
#   - https://github.com/openai/codex/blob/main/docs/config.md

# ---------------------------------------------------------------------------- #
#                                   General                                    #
# ---------------------------------------------------------------------------- #

approval_policy = "never"
check_for_update_on_startup = true
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "friendly"
plan_mode_reasoning_effort = "max"
sandbox_mode = "danger-full-access"
service_tier = "default"
suppress_unstable_features_warning = true
web_search = "live"

# ---------------------------------------------------------------------------- #
#                                    Notify                                    #
# ---------------------------------------------------------------------------- #

# Desktop app rewrites "notify" on start: https://github.com/openai/codex/issues/28404
# It does this even if "Turn completion notifications", "Enable permission notifications",
# and "Enable question notifications" are all set to false
notify = [
  "/Users/prb/.codex/computer-use/Codex Computer Use.app/Contents/SharedSupport/SkyComputerUseClient.app/Contents/MacOS/SkyComputerUseClient",
  "turn-ended",
  "--previous-notify",
  "[\"ai-notify\",\"codex\"]",
]

# ---------------------------------------------------------------------------- #
#                                     Apps                                     #
# ---------------------------------------------------------------------------- #

[apps._default]
  enabled = false

# ---------------------------------------------------------------------------- #
#                                    Desktop                                   #
# ---------------------------------------------------------------------------- #
[desktop]
  composerEnterBehavior = "enter"
  dock-icon-preference = "codex-system"
  enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "max"]
  followUpQueueMode = "steer"
  keepRemoteControlAwakeWhilePluggedIn = true
  mac-menu-bar-enabled = false
  notifications-permissions-enabled = false
  notifications-questions-enabled = false
  notifications-turn-mode = "off"
  preventSleepWhileRunning = true
  show-context-window-usage = true
  usePointerCursors = true

[desktop.open-in-target-preferences]
  global = "cursor"

# ---------------------------------------------------------------------------- #
#                                   Features                                   #
# ---------------------------------------------------------------------------- #
[features]
  apps = false
  browser_use = false
  browser_use_external = false
  browser_use_full_cdp_access = false
  computer_use = true
  default_mode_request_user_input = true
  image_generation = true
  in_app_browser = false
  js_repl = false
  multi_agent = true
  plugin_sharing = false
  plugins = true
  remote_compaction_v2 = true
  remote_plugin = false
  shell_snapshot = true
  tool_suggest = false
  unified_exec = true

[features.multi_agent_v2]
  enabled = true
  expose_spawn_agent_model_overrides = true
  hide_spawn_agent_metadata = false
  max_concurrent_threads_per_session = 4
  tool_namespace = "agents"
  wait_agent_enabled = true

  # ---------------------------------------------------------------------------- #
  #                                    History                                   #
  # ---------------------------------------------------------------------------- #

[history]
  persistence = "save-all"

